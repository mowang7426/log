name: Build CrashAnalyzer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz

      - name: Set THEOS
        run: |
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install RootHide Theos
        run: |
          set -e
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          rm -rf /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Verify Theos environment
        run: |
          set -e
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/bundle.mk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          xcodebuild -version

      - name: Verify package metadata
        run: |
          set -e
          grep -E '^(Package|Name|Version|Depends):' control

      - name: Prepare build directory
        run: |
          rm -rf build packages
          mkdir -p build

      - name: Build Rootless arm64e
        run: |
          set -e
          make clean
          ARCHS=arm64e THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          deb=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$deb"
          cp "$deb" build/CrashAnalyzer-arm64e-rootless.deb

      - name: Clean before RootHide
        run: |
          make clean
          rm -rf packages

      - name: Build RootHide arm64e
        run: |
          set -e
          ARCHS=arm64e THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1
          deb=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$deb"
          cp "$deb" build/CrashAnalyzer-arm64e-roothide.deb

      - name: Verify preference bundle is packaged
        run: |
          set -e
          for deb in build/*.deb; do
            echo "===== Checking $deb ====="
            dpkg-deb -c "$deb" | grep -E 'PreferenceBundles/CrashAnalyzerPrefs.bundle|PreferenceLoader/Preferences/CrashAnalyzer.plist'
          done

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: CrashAnalyzer-packages
          path: build/*.deb
